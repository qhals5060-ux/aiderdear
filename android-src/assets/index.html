/* v24: pose-cycling mascot – stand, wave, sit */
.pose-mascot{filter:drop-shadow(0 18px 26px rgba(15,10,64,.35))!important}
.pose-stage{position:absolute;inset:0;overflow:visible;animation:stageLife 7.2s ease-in-out infinite;transform-origin:50% 88%}
.pose-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;border-radius:42% 42% 34% 34%;-webkit-mask-image:radial-gradient(ellipse at center,#000 60%,transparent 92%);mask-image:radial-gradient(ellipse at center,#000 60%,transparent 92%);opacity:0;will-change:opacity,transform,filter}
.pose-stand{animation:poseStand 7.2s steps(1,end) infinite}
.pose-wave{animation:poseWave 7.2s steps(1,end) infinite}
.pose-sit{animation:poseSit 7.2s steps(1,end) infinite}
@keyframes poseStand{0%,24%,100%{opacity:1;transform:translateY(0) scale(1)}25%,99%{opacity:0}}
@keyframes poseWave{0%,24%,52%,100%{opacity:0}25%,51%{opacity:1;transform:translateY(-4px) rotate(-1.5deg) scale(1.02)}}
@keyframes poseSit{0%,51%,85%,100%{opacity:0}52%,84%{opacity:1;transform:translateY(7px) scale(1.03)}}
@keyframes stageLife{0%,20%{transform:translateY(0) scale(1)}25%{transform:translateY(-5px) scale(1.015)}33%{transform:translateY(-10px) rotate(-1.5deg)}41%{transform:translateY(-4px) rotate(1deg)}50%{transform:translateY(0)}58%{transform:translateY(5px) scale(1.015,.985)}70%{transform:translateY(9px) scale(1.02,.97)}82%{transform:translateY(8px)}100%{transform:translateY(0)}}
.pose-mascot .mascot-aura{bottom:0!important;height:16%!important;animation:auraLife 7.2s ease-in-out infinite!important}
@keyframes auraLife{0%,100%{transform:scaleX(1);opacity:.65}34%{transform:scaleX(.78);opacity:.35}70%{transform:scaleX(1.12);opacity:.75}}
/* v24 reading hub */
.reading-app{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px;align-items:start}
.reading-blue{background:linear-gradient(155deg,#2d729c 0%,#367ca5 52%,#2d6c95 100%);border-radius:24px;padding:18px;color:#fff;min-width:0;box-shadow:0 18px 44px rgba(31,74,108,.18)}
.reading-welcome{display:flex;justify-content:space-between;gap:14px;align-items:start}
.reading-welcome small{font-size:8px;color:#dceef8}.reading-welcome h2{font-size:19px;margin:4px 0 12px;letter-spacing:-.045em}
.reading-welcome>button{width:38px;height:38px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:50%;font-size:20px}
.reading-nav{display:flex;gap:6px;margin-bottom:12px}.reading-nav button{border:0;border-radius:999px;background:#ffffff13;color:#dcecf6;padding:7px 12px;font-size:8px}.reading-nav button.active{background:#fff;color:#2e6f98;font-weight:800}
.remember-layout,.record-layout,.achievement-layout{display:grid;gap:10px}
.reading-paper{position:relative;background:#f8f2e6;color:#23313d;border-radius:18px;padding:14px;box-shadow:0 10px 22px rgba(13,38,55,.12);overflow:hidden}
.reading-paper:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 0 66%,rgba(232,219,194,.26) 66% 67%,transparent 67%);pointer-events:none}
.current-book{display:grid;grid-template-columns:minmax(0,1fr) 86px;min-height:145px;align-items:center}
.paper-tab{position:absolute;top:0;left:32%;width:38px;height:9px;background:#f1c323;border-radius:0 0 5px 5px;box-shadow:0 2px 4px #a16a0033}
.current-copy small,.achievement-hero small,.record-head small{font-size:7px;color:#7a8993}.current-copy h3{font-size:18px;margin:4px 0}.current-copy p{font-size:8px;color:#70808a;margin:0 0 10px}
.rprogress{height:5px;background:#e3ded5;border-radius:99px;overflow:hidden}.rprogress i{display:block;height:100%;background:linear-gradient(90deg,#4b83c0,#796ce9);border-radius:99px}.current-copy>span{font-size:7px;color:#71808a}
.featured-cover{width:76px;height:104px;border-radius:9px;background:#fff;overflow:hidden;display:grid;place-items:center;box-shadow:0 9px 16px rgba(43,55,65,.16)}.featured-cover img{width:100%;height:100%;object-fit:cover}.featured-cover.demo{font-size:28px;color:#2e6f98}
.memory header,.record-head{display:flex;justify-content:space-between;align-items:center}.memory header button,.record-head button{border:0;background:#2f75a0;color:#fff;border-radius:9px;padding:7px 9px;font-size:7px}
.reading-note{margin:8px 0 0;border-radius:12px;background:#fffaf1;padding:11px;border-left:3px solid #84b5cf}.reading-note small{font-size:7px;color:#6f7d86}.reading-note p{font-size:9px;line-height:1.65;margin:4px 0;color:#343e45}.reading-note em{font-style:normal;font-size:7px;color:#8b959d}
.reading-shelf,.achievement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rbook{position:relative;background:#fff8ed;border-radius:13px;padding:7px;min-width:0;box-shadow:0 7px 16px rgba(72,61,42,.08)}.rbook>button{position:absolute;right:2px;top:2px;border:0;background:transparent;color:#9d9588}.rcover{height:86px;border-radius:8px;background:linear-gradient(145deg,#e3d3b3,#88a9bd);overflow:hidden;display:grid;place-items:center;color:#fff;font-size:19px}.rcover img{width:100%;height:100%;object-fit:cover}.rbook b,.rbook span,.rbook small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rbook b{font-size:8px;margin-top:6px}.rbook span,.rbook small{font-size:6px;color:#7b858a}.rbook i{display:block;height:4px;background:#e2e5e7;border-radius:99px;margin:5px 0;overflow:hidden}.rbook i em{display:block;height:100%;background:#4b83c0}
.quote-editor p{font-size:8px;color:#687780}.achievement-hero h3{font-size:18px;margin:4px 0 12px}.achievement-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.achievement-metrics div{background:#fffaf2;border-radius:12px;padding:10px;text-align:center}.achievement-metrics b{display:block;font-size:20px;color:#2f75a0}.achievement-metrics span{font-size:7px;color:#7b878d}
.reading-timer{background:#fff;border:1px solid #e5e9ef;border-radius:22px;padding:14px;display:grid;gap:12px;box-shadow:0 12px 30px rgba(28,37,84,.06)}.reading-timer small{font-size:7px;letter-spacing:.12em;color:#8b91a0}.reading-timer strong{display:block;font-size:28px;margin:3px 0;color:#2d365a}.reading-timer span{font-size:7px;color:#8b91a0}.timer-ring{width:112px;height:112px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#367ca5 0 72%,#e8ebf0 72%);position:relative}.timer-ring:after{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}.timer-ring button{position:relative;z-index:2;width:48px;height:48px;border:0;border-radius:50%;background:#3158e8;color:#fff;font-size:18px;box-shadow:0 8px 18px #3158e844}.timer-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.timer-actions button{border:0;border-radius:9px;background:#f1f3f7;padding:8px;font-size:8px;color:#4d5566}
@media(max-width:720px){.reading-app{grid-template-columns:1fr}.reading-blue{padding:13px;border-radius:20px}.reading-shelf,.achievement-grid{grid-template-columns:repeat(3,1fr)}.reading-timer{grid-template-columns:1fr auto;align-items:center}.timer-ring{width:82px;height:82px;grid-row:1/3;grid-column:2}.timer-actions{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}.pose-mascot.hero{width:154px!important;height:178px!important}}
@media(prefers-reduced-motion:reduce){.pose-stage,.pose-frame,.pose-mascot .mascot-aura{animation:none!important}.pose-stand{opacity:1!important}.pose-wave,.pose-sit{opacity:0!important}}


/* v25: inline 3D jelly mascot, always visible */
.live-jelly{z-index:7!important;overflow:visible!important;filter:drop-shadow(0 16px 24px rgba(42,24,91,.30))!important}.live-jelly .jelly-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.live-jelly .jelly-character{transform-box:fill-box;transform-origin:50% 90%;animation:jellyLife25 8s cubic-bezier(.42,0,.36,1) infinite}.live-jelly .right-arm{transform-box:fill-box;transform-origin:30% 82%;animation:jellyWave25 8s ease-in-out infinite}.live-jelly .left-arm{transform-box:fill-box;transform-origin:70% 82%;animation:jellyLeft25 8s ease-in-out infinite}.live-jelly .jelly-feet{transform-box:fill-box;transform-origin:center;animation:jellyFeet25 8s ease-in-out infinite}.live-jelly .curl{transform-box:fill-box;transform-origin:45% 85%;animation:jellyCurl25 2.4s ease-in-out infinite}.live-jelly .eye{transform-box:fill-box;transform-origin:center;animation:jellyBlink25 4.2s infinite}.live-jelly .shine.big{animation:jellyShine25 3s ease-in-out infinite}.live-jelly:after{content:"";position:absolute;left:18%;right:18%;bottom:2%;height:8%;border-radius:50%;background:rgba(36,30,91,.28);filter:blur(8px);animation:jellyShadow25 8s ease-in-out infinite}.live-jelly.hero{position:absolute!important;right:2%!important;bottom:-5px!important;width:190px!important;height:210px!important}.live-jelly.intro{width:210px!important;height:232px!important;margin:0 auto -8px!important}.live-jelly.mini{width:96px!important;height:108px!important}
@keyframes jellyLife25{0%,13%{transform:translateY(0) scale(1)}18%{transform:translateY(-8px) scale(.99,1.02)}24%,38%{transform:translateY(-10px) rotate(-1deg)}43%{transform:translateY(-3px)}50%{transform:translateY(7px) scale(1.04,.92)}57%,77%{transform:translateY(13px) scale(1.07,.84)}82%{transform:translateY(6px) scale(1.03,.93)}90%,100%{transform:translateY(0) scale(1)}}
@keyframes jellyWave25{0%,17%,42%,100%{transform:rotate(0deg) translate(0,0)}21%{transform:rotate(-38deg) translate(-2px,-6px)}25%{transform:rotate(-65deg) translate(-3px,-12px)}29%{transform:rotate(-32deg) translate(-2px,-8px)}33%{transform:rotate(-68deg) translate(-3px,-12px)}37%{transform:rotate(-28deg) translate(-1px,-6px)}57%,77%{transform:rotate(22deg) translate(-2px,5px)}}

.screen-first .view{overflow:hidden!important;padding:4px 2px calc(76px + env(safe-area-inset-bottom))!important}

function renderHealthFields(){let ht=$('#pHealthType')?.value||personalPreset.healthType||'meal',host=$('#pHealthSpecific');if(!host)return;if(ht==='meal')host.innerHTML=`<div class="field-grid"><label>끼니<select id="pMeal"><option value="breakfast">아침</option><option value="lunch">점심</option><option value="dinner">저녁</option><option value="snack">간식</option></select></label><label>식사 시간<input id="pMealTime" type="time"></label><label>평점<select id="pRating"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></label><label>장소<input id="pLocation"></label></div>`;else host.innerHTML=`<label>운동 시간(분)<input id="pMinutes" type="number" min="0" max="1440"></label><div class="exercise-builder"><header><b>운동 종목과 세트</b><button type="button" id="addExercise">＋ 종목</button></header><div id="exerciseDraft"></div></div>`;if(ht==='meal'&&personalPreset.mealType){$('#pMeal').value=personalPreset.mealType}if(ht==='exercise')renderExerciseDraft()}
let exerciseDraft=[];function renderExerciseDraft(){if(!exerciseDraft.length)exerciseDraft=[{name:'',sets:[{weight:'',reps:''}]}];let host=$('#exerciseDraft');if(!host)return;host.innerHTML=exerciseDraft.map((e,ei)=>`<article class="exercise-edit"><header><input data-exname="${ei}" placeholder="운동 종목" value="${esc(e.name)}"><button type="button" data-exremove="${ei}">×</button></header>${e.sets.map((st,si)=>`<div class="set-edit"><span>${si+1} SET</span><label><input data-weight="${ei},${si}" type="number" step="0.1" min="0" value="${st.weight}"><small>kg</small></label><label><input data-reps="${ei},${si}" type="number" min="0" value="${st.reps}"><small>회</small></label><button type="button" data-setremove="${ei},${si}">×</button></div>`).join('')}<button type="button" data-setadd="${ei}">＋ 세트</button></article>`).join('');host.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{let k=e.target.dataset.exname;if(k!=null)exerciseDraft[+k].name=e.target.value;let w=e.target.dataset.weight;if(w){let[a,b]=w.split(',').map(Number);exerciseDraft[a].sets[b].weight=e.target.value}let r=e.target.dataset.reps;if(r){let[a,b]=r.split(',').map(Number);exerciseDraft[a].sets[b].reps=e.target.value}});host.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.exremove!=null){exerciseDraft.splice(+b.dataset.exremove,1);renderExerciseDraft()}else if(b.dataset.setadd!=null){exerciseDraft[+b.dataset.setadd].sets.push({weight:'',reps:''});renderExerciseDraft()}else if(b.dataset.setremove){let[a,c]=b.dataset.setremove.split(',').map(Number);exerciseDraft[a].sets.splice(c,1);if(!exerciseDraft[a].sets.length)exerciseDraft[a].sets.push({weight:'',reps:''});renderExerciseDraft()}}}
function openPersonal(cat,p={}){personalOverview=false;personalPomodoro=false;personalCategory=cat;personalPreset=p;exerciseDraft=[];personalPhotoFile=null;personalPhotoData='';window.AiderLogAppPhotosV176?.resetPersonal();$('#personalModalTitle').textContent=cat==='health'?(p.healthType==='exercise'?'운동 기록 추가':'건강 기록 추가'):cat==='reading'?'독서 기록 추가':cat==='workflow'?'워크플로우 기록 추가':'금융 기록 추가';$('#personalDate').value=today();$('#personalTitle').value='';$('#personalNote').value='';$('#personalFields').innerHTML=personalFieldHTML(cat,p);$('#personalPhotoPreview').innerHTML='';$('#personalModal').classList.add('on');if(cat==='health'){renderHealthFields();$('#pHealthType').onchange=renderHealthFields}}
async function savePersonalForm(e){e.preventDefault();let cat=personalCategory,title=$('#personalTitle').value.trim();if(!title)return;let row={id:'pi-'+Date.now(),category:cat,date:$('#personalDate').value||today(),title,note:$('#personalNote').value.trim(),createdAt:Date.now(),details:{}};if(cat==='health'){let ht=$('#pHealthType').value;row.details.healthType=ht;if(ht==='meal')Object.assign(row.details,{mealType:$('#pMeal').value,time:$('#pMealTime').value,rating:+$('#pRating').value,location:$('#pLocation').value.trim()});else{row.minutes=+$('#pMinutes').value||0;row.details.exercises=exerciseDraft.map(ex=>({name:ex.name.trim(),sets:ex.sets.map(st=>({weight:+st.weight||0,reps:+st.reps||0})).filter(st=>st.weight||st.reps)})).filter(ex=>ex.name);if(!row.details.exercises.length)return alert('운동 종목을 하나 이상 입력해주세요.')}}else if(cat==='reading')Object.assign(row.details,{readingStatus:$('#pReadingStatus').value,author:$('#pAuthor').value.trim(),currentPage:+$('#pCurrent').value||0,totalPages:+$('#pTotal').value||0,quotePage:+$('#pQuotePage').value||0,quote:$('#pQuote').value.trim()});else if(cat==='workflow'){row.status=$('#pStatus').value;Object.assign(row.details,{project:$('#pProject').value.trim(),progress:+$('#pProgress').value||0,dueDate:$('#pDue').value,next:$('#pNext').value.trim(),steps:$('#pSteps').value.split('\n').map(x=>x.trim()).filter(Boolean)})}else{row.amount=+$('#pAmount').value||0;Object.assign(row.details,{financeType:$('#pFinanceType').value,source:$('#pSource').value.trim(),cycle:$('#pCycle').value,dueDay:+$('#pDueDay').value||0,goal:+$('#pGoal').value||0,maturityDate:$('#pMaturity').value,destination:$('#pDestination').value.trim(),expectedDate:$('#pExpected').value,flowStatus:$('#pFlow').value,paymentChecks:{}})}await window.AiderLogAppPhotosV176.savePersonal(row)}
function bindPersonal(){$$('[data-pcat]').forEach(b=>b.onclick=()=>{personalOverview=false;personalPomodoro=false;personalCategory=b.dataset.pcat;renderPersonal()});$('[data-poverview]')&&($('[data-poverview]').onclick=()=>{personalOverview=true;personalPomodoro=false;renderPersonal()});$('[data-ppomodoro]')&&($('[data-ppomodoro]').onclick=()=>{personalOverview=false;personalPomodoro=true;renderPersonal()});$$('[data-padd]').forEach(b=>b.onclick=()=>openPersonal(b.dataset.padd,{healthType:b.dataset.health||'',mealType:b.dataset.meal||''}));$$('[data-pdelete]').forEach(b=>b.onclick=async()=>{if(!confirm('이 기록을 삭제할까요?'))return;await window.AiderLogAppPhotosV176.deletePersonal(b.dataset.pdelete)});$$('[data-odays]').forEach(b=>b.onclick=()=>{personalOverviewDays=+b.dataset.odays;renderPersonal()});$$('[data-fcheck]').forEach(c=>c.onchange=async()=>{let r=personalItems().find(x=>x.id===c.dataset.fcheck);if(!r)return;let k=financeCheckKey(r);r.details.paymentChecks=r.details.paymentChecks||{};if(c.checked)r.details.paymentChecks[k]=Date.now();else delete r.details.paymentChecks[k];await savePrivate()});$$('[data-pomo]').forEach(b=>b.onclick=()=>{let[min,mode]=b.dataset.pomo.split(',');setPomo(+min,mode)});$('#pomoStart')&&($('#pomoStart').onclick=togglePomo);$('#pomoReset')&&($('#pomoReset').onclick=()=>setPomo(Math.round(pomoInitial/60),pomoMode));$('#pomoTask')&&($('#pomoTask').onchange=async e=>{P.pomodoroTask=e.target.value;await savePrivate()})}
function setPomo(min,mode){clearInterval(pomoTimer);pomoRunning=false;pomoMode=mode;pomoInitial=pomoRemaining=min*60;renderPersonal()}
function togglePomo(){if(pomoRunning){clearInterval(pomoTimer);pomoRunning=false;renderPersonal();return}pomoRunning=true;pomoTimer=setInterval(async()=>{pomoRemaining--;let c=$('#pomoClock');if(c)c.textContent=`${String(Math.floor(pomoRemaining/60)).padStart(2,'0')}:${String(pomoRemaining%60).padStart(2,'0')}`;if(pomoRemaining<=0){clearInterval(pomoTimer);pomoRunning=false;if(pomoMode==='focus'){P.pomodoroSessions=P.pomodoroSessions||[];P.pomodoroSessions.push({id:'pomo-'+Date.now(),date:today(),minutes:Math.round(pomoInitial/60),task:P.pomodoroTask||'집중 세션',completedAt:Date.now()});await savePrivate()}navigator.vibrate?.([80,60,80]);pomoRemaining=pomoInitial;renderPersonal()}},1000);renderPersonal()}
$('#personalForm').addEventListener('submit',savePersonalForm);$('#personalClose').onclick=$('#personalCancel').onclick=()=>$('#personalModal').classList.remove('on');$('#personalPhoto').onchange=e=>{let f=e.target.files?.[0];if(!f)return;personalPhotoFile=f;let r=new FileReader();r.onload=()=>{personalPhotoData=String(r.result||'');$('#personalPhotoPreview').innerHTML=`<img src="${personalPhotoData}" alt="선택한 사진">`};r.readAsDataURL(f)};

let wheelSelected=null;
const wheelEl=$('#wheel'),wheelCore=$('#wheelCore');
function setWheel(v){wheelEl.classList.toggle('open',!!v);wheelCore.setAttribute('aria-expanded',String(!!v));if(!v){wheelSelected=null;$$('.global-wheel-item-v126').forEach(x=>x.classList.remove('hovered'))}}

$('#searchBtn').onclick=()=>{$('#searchSheet').classList.add('on');$('#globalSearch').focus();$('#globalSearch').dispatchEvent(new Event('input'))};$('#closeSearch').onclick=()=>$('#searchSheet').classList.remove('on');$('#globalSearch').oninput=()=>{let q=$('#globalSearch').value.trim().toLowerCase(),items=[...(A.scheduleEvents||[]).map(x=>({t:x.title||'일정',s:'일정',p:'home'})),...records().map(x=>({t:x.title||'Record',s:x.body||'',p:'event'})),...(P.routines||[]).map(x=>({t:x.text||'Routine',s:'Routine',p:'routine'})),{t:'Travel',s:'여행',p:'event',m:'travel'},{t:'Archive',s:'영화 공연 전시 책 음악',p:'event',m:'archive'}].filter(x=>!q||(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,12);$('#searchResults').innerHTML=items.map((x,i)=>`<button data-i="${i}"><b>${esc(x.t)}</b><br><small>${esc(x.s)}</small></button>`).join('');[...$('#searchResults').children].forEach((b,i)=>b.onclick=()=>{let x=items[i];if(x.m)eventMode=x.m;$('#searchSheet').classList.remove('on');go(x.p,false,!!x.m)})};
