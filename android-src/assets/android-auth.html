<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ff">
  <title>AiderLog Google 로그인</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#28203f;background:#f5f2ff;color-scheme:light}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 82% 15%,rgba(178,139,235,.28),transparent 31%),radial-gradient(circle at 12% 82%,rgba(153,203,255,.24),transparent 34%),radial-gradient(circle,rgba(104,79,170,.24) 0 1px,transparent 1.35px),linear-gradient(155deg,#fff 0%,#f7f3ff 52%,#ede8ff 100%);background-size:auto,auto,71px 71px,auto;background-position:center,center,8px 14px,center}
    main{width:min(100%,420px);padding:32px 24px;border:1px solid rgba(111,82,183,.19);border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 20px 58px rgba(75,49,137,.13),inset 0 1px 0 #fff;text-align:center;backdrop-filter:blur(18px)}
    .planet{position:relative;width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle at 34% 27%,rgba(255,255,255,.94),transparent 26%),linear-gradient(145deg,#8f72dc,#ad87e7 64%,#d4b7ef);box-shadow:0 0 20px rgba(255,255,255,.92),0 0 44px rgba(126,87,224,.35),inset -7px -9px 12px rgba(86,52,158,.18)}
    .planet:before{content:"";position:absolute;inset:27px -10px;border:2px solid #fff;border-radius:50%;transform:rotate(-18deg);filter:drop-shadow(0 0 7px rgba(118,87,216,.68))}
    .planet:after{content:"";position:absolute;width:7px;height:7px;right:4px;top:20px;border-radius:50%;background:#fff;box-shadow:0 0 9px #9b76e4}
    h1{font-size:24px;margin:0 0 10px;color:#28203f}p{font-size:14px;line-height:1.65;color:#746b89;margin:0 0 22px}
    button{width:100%;min-height:52px;border:1px solid rgba(100,68,187,.24);border-radius:16px;background:linear-gradient(135deg,#7657d8,#9d72df 72%,#b88de8);color:#fff;font-weight:750;font-size:15px;cursor:pointer;box-shadow:0 10px 25px rgba(103,72,185,.22),inset 0 1px 0 rgba(255,255,255,.22)}
    button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin:16px 0 0;font-size:13px;color:#6748cf}.error{color:#bd4161}
  </style>
</head>
<body>
  <main>
    <div class="planet" aria-hidden="true"></div>
    <h1>AiderLog 로그인</h1>
    <p>Google 인증은 안전한 시스템 브라우저에서 진행됩니다.<br>완료되면 AiderLog 앱으로 자동으로 돌아갑니다.</p>
    <button id="loginButton" type="button">Google 계정으로 계속</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyALzfkvB9MscSFBxz6I4mtHtCmx1G5bdaw',
      authDomain: 'aiderdear-1bbca.firebaseapp.com',
      projectId: 'aiderdear-1bbca',
      storageBucket: 'aiderdear-1bbca.firebasestorage.app',
      messagingSenderId: '272602158936',
      appId: '1:272602158936:web:4b516691f374849a52772d'
    };
    const state = new URLSearchParams(location.search).get('state') || '';
    const button = document.getElementById('loginButton');
    const status = document.getElementById('status');

    function returnToApp(params) {
      params.set('state', state);
      const callback = `aiderlog://auth?${params.toString()}`;
      const open = () => { location.href = callback; };
      status.classList.remove('error');
      status.textContent = '인증 완료 · AiderLog로 돌아가는 중…';
      button.disabled = false;
      button.textContent = 'AiderLog로 돌아가기';
      button.onclick = open;
      open();
    }

    button.addEventListener('click', async () => {
      if (!state) {
        status.classList.add('error');
        status.textContent = '로그인 요청 정보가 없습니다. 앱에서 다시 시작해주세요.';
        return;
      }
      button.disabled = true;
      status.classList.remove('error');
      status.textContent = 'Google 계정을 확인하고 있습니다…';
      try {
        const auth = getAuth(initializeApp(firebaseConfig));
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        if (!credential?.idToken && !credential?.accessToken) throw new Error('Google 인증 정보를 받지 못했습니다.');
        returnToApp(new URLSearchParams({
          id_token: credential.idToken || '',
          access_token: credential.accessToken || ''
        }));
      } catch (error) {
        button.disabled = false;
        status.classList.add('error');
        if (error?.code === 'auth/popup-closed-by-user') status.textContent = '로그인 창이 닫혔습니다. 다시 시도해주세요.';
        else status.textContent = error?.message || 'Google 로그인을 완료하지 못했습니다.';
      }
    });
  </script>
</body>
</html>
