<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiderLog launcher preview XML fixture</title>
<style>
html,body{margin:0;background:transparent;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}body{font-family:"Malgun Gothic",sans-serif;color:#171A3A}#host{overflow:hidden;isolation:isolate}#failure{margin:10px;color:#9b1530;white-space:pre-wrap}
</style><main id="host"></main><pre id="failure" hidden></pre>
<script>
'use strict';
// This measurement adapter is not Android rendering. It is used only to produce
// fallback previewImage PNGs from the native previewLayout XML, never a widget.
(async()=>{
  const bundle=await fetch('/fixtures.json').then(r=>r.json()),query=new URLSearchParams(location.search);
  const spec=bundle.specs.find(s=>s.name===query.get('name'))||bundle.specs[0];
  const host=document.getElementById('host');host.style.width=spec.width+'px';host.style.height=spec.height+'px';
  host.dataset.name=spec.name;host.dataset.width=spec.width;host.dataset.height=spec.height;
  const parser=new DOMParser(),get=(el,key)=>el.getAttribute('android:'+key)||'',unit=x=>x.replace(/(dp|dip|sp)$/,'px'),color=x=>/^#[0-9a-f]{8}$/i.test(x)?'#'+x.slice(3)+x.slice(1,3):x;
  const doc=parser.parseFromString(spec.xml,'text/xml');if(doc.querySelector('parsererror'))throw Error(doc.querySelector('parsererror').textContent);
  function drawable(ref,div){
    if(!ref)return;const name=ref.replace('@drawable/','');
    if(bundle.images[name]){div.style.backgroundImage=`url('${bundle.images[name]}')`;div.style.backgroundSize='100% 100%';return;}
    if(ref.startsWith('#')){div.style.backgroundColor=color(ref);return;}
    const source=bundle.drawables[name];if(!source)return;
    const shape=parser.parseFromString(source,'text/xml'),solid=shape.querySelector('solid'),stroke=shape.querySelector('stroke'),corners=shape.querySelector('corners');
    if(solid)div.style.backgroundColor=color(get(solid,'color'));
    if(stroke)div.style.border=unit(get(stroke,'width'))+' solid '+color(get(stroke,'color'));
    if(corners)div.style.borderRadius=unit(get(corners,'radius'));
    if(get(shape.documentElement,'shape')==='oval')div.style.borderRadius='50%';
  }
  function node(el,parent){
    const div=document.createElement('div'),s=div.style;div.dataset.native=el.tagName;
    if(get(el,'id'))div.dataset.nativeId=get(el,'id').split('/').pop();
    s.display='flex';s.flexDirection=get(el,'orientation')==='horizontal'?'row':'column';s.minWidth='0';s.minHeight='0';s.flexShrink='0';s.position='relative';
    if(get(el,'visibility')==='gone'){s.display='none';return div;}
    const mappings={layout_width:'width',layout_height:'height',minHeight:'minHeight',minWidth:'minWidth',maxWidth:'maxWidth',padding:'padding',paddingTop:'paddingTop',paddingBottom:'paddingBottom',paddingLeft:'paddingLeft',paddingRight:'paddingRight',paddingStart:'paddingLeft',paddingEnd:'paddingRight',layout_margin:'margin',layout_marginLeft:'marginLeft',layout_marginRight:'marginRight',layout_marginTop:'marginTop',layout_marginBottom:'marginBottom'};
    for(const[a,b]of Object.entries(mappings)){const v=get(el,a);if(v)s[b]=v==='match_parent'?'100%':v==='wrap_content'?'auto':unit(v);}
    const marginX=(parseFloat(get(el,'layout_marginLeft')||get(el,'layout_margin'))||0)+(parseFloat(get(el,'layout_marginRight')||get(el,'layout_margin'))||0);
    const marginY=(parseFloat(get(el,'layout_marginTop')||get(el,'layout_margin'))||0)+(parseFloat(get(el,'layout_marginBottom')||get(el,'layout_margin'))||0);
    if(get(el,'layout_width')==='match_parent'&&marginX)s.width=`calc(100% - ${marginX}px)`;
    if(get(el,'layout_height')==='match_parent'&&marginY)s.height=`calc(100% - ${marginY}px)`;
    const weight=get(el,'layout_weight');
    if(get(el,'layout_gravity')==='center_horizontal')s.alignSelf='center';
    if(weight&&parent?.tagName!=='FrameLayout'){s.flexGrow=weight;s.flexBasis='0';s.flexShrink='1';if(get(parent,'orientation')==='horizontal')s.width='0';else s.height='0';}
    // Only full-frame backgrounds/photos overlap. Small covers in horizontal
    // LinearLayouts keep their actual native 67/83dp dimensions.
    if(parent?.tagName==='FrameLayout'&&el.tagName==='ImageView'&&get(el,'layout_width')==='match_parent'&&get(el,'layout_height')==='match_parent'){s.position='absolute';s.inset='0';}
    drawable(get(el,'background'),div);
    if(el.tagName==='ImageView'){
      drawable(get(el,'src'),div);s.backgroundRepeat='no-repeat';s.backgroundPosition='center';
      if(get(el,'scaleType')==='fitCenter')s.backgroundSize='contain';
    }
    if(el.tagName==='ProgressBar'){
      s.background=get(el,'progressBackgroundTint')||'#DED9FF';s.borderRadius='4px';s.overflow='hidden';
      const bar=document.createElement('i');bar.style.cssText=`display:block;flex-shrink:0;background:${get(el,'progressTint')||'#6255E8'};height:100%;width:${Number(get(el,'progress'))||0}%;border-radius:4px`;div.append(bar);
    }
    if(el.tagName==='TextView'){
      s.fontSize=unit(get(el,'textSize')||'14sp');s.color=color(get(el,'textColor')||'#171A3A');s.fontWeight=get(el,'textStyle')==='bold'?'700':'400';
      s.whiteSpace='pre-line';s.lineHeight=get(el,'lineSpacingMultiplier')||'1.3';s.overflow='hidden';div.textContent=get(el,'text');
      if(get(el,'lineSpacingExtra'))s.lineHeight=`calc(1.3em + ${unit(get(el,'lineSpacingExtra'))})`;
      const gravity=get(el,'gravity');if(gravity.includes('center'))s.justifyContent='center';if(gravity==='center')s.alignItems='center';if(gravity.includes('right'))s.alignItems='flex-end';
    }else{
      if(get(el,'gravity')==='center_vertical')s.alignItems='center';
      for(const child of el.children)div.append(node(child,el));
    }
    return div;
  }
  host.append(node(doc.documentElement,null));
  await document.fonts.ready;
  await Promise.all(Object.values(bundle.images).map(src=>new Promise(resolve=>{const image=new Image();image.onload=resolve;image.onerror=resolve;image.src=src;})));
  host.dataset.ready='true';document.title=spec.name;
  const outside=[...host.querySelectorAll('[data-native="TextView"]')].filter(e=>{const r=e.getBoundingClientRect();return e.textContent.trim()&&r.width&&r.height&&(r.left<-1||r.right>spec.width+1||r.bottom>spec.height+1);}).map(e=>({text:e.textContent,bottom:e.getBoundingClientRect().bottom}));
  host.dataset.overflowCount=String(outside.length);
  window.pickerFixtureReport={name:spec.name,xmlValid:true,width:spec.width,height:spec.height,outside,notAndroidScreenshot:true};
})().catch(error=>{const failure=document.getElementById('failure');failure.hidden=false;failure.textContent=error.stack||String(error);document.getElementById('host').dataset.ready='error';});
</script></html>
