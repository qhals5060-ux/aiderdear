<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6255e8">
  <title>AiderLog Google 로그인</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#15172d;background:#f7f6ff}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(123,108,242,.16),transparent 34%),#f7f6ff}
    main{width:min(100%,420px);padding:30px 24px;border:1px solid #e7e3f6;border-radius:26px;background:#fff;box-shadow:0 18px 54px rgba(35,30,90,.12);text-align:center}
    .planet{position:relative;width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle at 35% 27%,rgba(255,255,255,.74),transparent 31%),linear-gradient(145deg,#5b54e8,#7967f0 60%,#5141cd);box-shadow:0 0 18px rgba(98,85,232,.30),0 0 42px rgba(98,85,232,.14)}
    .planet:before{content:"";position:absolute;inset:27px -10px;border:2px solid rgba(255,255,255,.9);border-radius:50%;transform:rotate(-18deg)}
    .planet:after{content:"";position:absolute;width:7px;height:7px;right:4px;top:20px;border-radius:50%;background:#fff;box-shadow:0 0 7px #fff}
    h1{font-size:24px;margin:0 0 10px}p{font-size:14px;line-height:1.65;color:#77758d;margin:0 0 22px}
    button{width:100%;min-height:52px;border:0;border-radius:16px;background:linear-gradient(135deg,#5b54e8,#7967f0);color:#fff;font-weight:750;font-size:15px;cursor:pointer;box-shadow:0 8px 22px rgba(98,85,232,.22)}
    button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin:16px 0 0;font-size:13px;color:#6255e8}.error{color:#b64058}
  </style>
</head>
<body>
  <main>
    <div class="planet" aria-hidden="true"></div>
    <h1>AiderLog 로그인</h1>
    <p>Google 인증은 안전한 시스템 브라우저에서 진행됩니다.<br>완료되면 AiderLog 앱으로 자동으로 돌아갑니다.</p>
    <button id="loginButton" type="button">Google 계정으로 계속</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyALzfkvB9MscSFBxz6I4mtHtCmx1G5bdaw',
      authDomain: 'aiderdear-1bbca.firebaseapp.com',
      projectId: 'aiderdear-1bbca',
      storageBucket: 'aiderdear-1bbca.firebasestorage.app',
      messagingSenderId: '272602158936',
      appId: '1:272602158936:web:4b516691f374849a52772d'
    };
    const state = new URLSearchParams(location.search).get('state') || '';
    const button = document.getElementById('loginButton');
    const status = document.getElementById('status');

    function returnToApp(params) {
      params.set('state', state);
      const callback = `aiderlog://auth?${params.toString()}`;
      const open = () => { location.href = callback; };
      status.classList.remove('error');
      status.textContent = '인증 완료 · AiderLog로 돌아가는 중…';
      button.disabled = false;
      button.textContent = 'AiderLog로 돌아가기';
      button.onclick = open;
      open();
    }

    button.addEventListener('click', async () => {
      if (!state) {
        status.classList.add('error');
        status.textContent = '로그인 요청 정보가 없습니다. 앱에서 다시 시작해주세요.';
        return;
      }
      button.disabled = true;
      status.classList.remove('error');
      status.textContent = 'Google 계정을 확인하고 있습니다…';
      try {
        const auth = getAuth(initializeApp(firebaseConfig));
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        if (!credential?.idToken && !credential?.accessToken) throw new Error('Google 인증 정보를 받지 못했습니다.');
        returnToApp(new URLSearchParams({
          id_token: credential.idToken || '',
          access_token: credential.accessToken || ''
        }));
      } catch (error) {
        button.disabled = false;
        status.classList.add('error');
        if (error?.code === 'auth/popup-closed-by-user') status.textContent = '로그인 창이 닫혔습니다. 다시 시도해주세요.';
        else status.textContent = error?.message || 'Google 로그인을 완료하지 못했습니다.';
      }
    });
  </script>
</body>
</html>
