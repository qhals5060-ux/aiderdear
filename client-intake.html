<script>
(() => {
  const source = new URL(location.href);
  const token = source.searchParams.get('client-intake') || '';
  const target = new URL('./', source);
  target.search = '';
  if (token) target.searchParams.set('client-intake', token);
  location.replace(target.href);
})();
</script>
